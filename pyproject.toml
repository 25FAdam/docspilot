[project]
name = "docspilot"
version = "0.1.0"
description = "RAG knowledge-base chatbot: LangGraph + Gemini + MCP + Streamlit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: calls the real Gemini API (needs GOOGLE_API_KEY); excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
